<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100d">
<title>미로 실험실</title>
<style>
/* ─────────────────────────────────────────────────────────────────
   여의주 규격을 그대로 가져왔다 (server/static/ys.css).
   여기는 혼자 도는 한 장짜리라 필요한 것만 옮겨 적는다.
   ───────────────────────────────────────────────────────────── */
:root{
  --ink-900:#12100d; --ink-800:#1b1815; --ink-700:#221e1a;
  --line:#332e28; --line-2:#4a433a;
  --text:#ece7de; --dim:#8b8275; --faint:#463f37;
  --gold:#e8b339; --green:#3fb950; --red:#e5534b;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",
    "맑은 고딕",system-ui,sans-serif;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  /* 미로는 두 가지 색뿐이다 — 벽은 검정, 다닐 수 있는 데는 흰색 */
  --wall:#0c0c0c; --way:#f4f4f2; --seen:#c3cbd3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--ink-900);color:var(--text);
  font:15px/1.6 var(--font);
  display:flex;flex-direction:column;overscroll-behavior:none;
}

header{
  flex:none;display:flex;align-items:center;gap:var(--s-3);
  padding:max(10px,env(safe-area-inset-top)) var(--s-4) 10px;
  border-bottom:1px solid var(--line);background:var(--ink-800);
  position:sticky;top:0;z-index:10;
}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{color:var(--dim);font-size:12px;font-weight:400;margin-left:6px}

main{flex:1;padding:var(--s-4) var(--s-4) calc(40px + env(safe-area-inset-bottom))}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{background:var(--ink-700);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 13px;font-size:14px;color:var(--text)}
.btn:active{background:var(--line)}
.btn.gold{border-color:var(--gold);color:var(--gold)}

.bar{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;
  margin-bottom:var(--s-4)}
label{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:6px}
select{font:inherit;color:var(--text);background:var(--ink-700);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px;margin:0}

h2{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.06em;
  margin:0 0 var(--s-2);padding-bottom:5px;border-bottom:1px solid var(--line)}
.note{color:var(--faint);font-size:12px;line-height:1.7;margin:var(--s-2) 0 0}

.wrap{display:flex;gap:var(--s-4);flex-wrap:wrap;align-items:flex-start}
.col{flex:1 1 300px;min-width:250px;max-width:460px}

/* ── 미로 판 ──────────────────────────────────────────────────────
   칸은 저마다 정사각형이 되어야 한다. 판에 aspect-ratio 를 걸면 기기에
   따라 칸이 늘어나므로, 칸마다 `::before{padding-top:100%}` 로 **제 폭만큼
   높이를 띄운다** — 퍼센트 세로 여백은 어디서나 제 폭을 기준으로 잡힌다 */
.board{display:grid;gap:1px;background:var(--line);
  border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:1px;overflow:hidden;touch-action:manipulation}
.board .px{background:var(--wall);position:relative;min-width:0}
.board .px::before{content:"";display:block;padding-top:100%}
.board .px.way{background:var(--way);cursor:pointer}
.board .px.seen{background:var(--seen)}
.board .px svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.board .px svg polygon{fill:var(--gold)}

/* ── 보이는 모습 ─────────────────────────────────────────────────
   천장과 바닥은 하얗고 벽면은 검정이다. 바탕을 흰색으로 깔고 벽만 얹는다 */
.view{position:relative;background:var(--way);
  border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden}
.view::before{content:"";display:block;padding-top:100%}
.view svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.view svg polygon,.view svg rect.wall{fill:var(--wall)}
.view svg rect.ring{fill:none;stroke:#9aa0a6;stroke-width:.006}
</style>
</head>
<body>

<header><h1>미로 실험실<span class="sub">서 · 북 · 동 · 남</span></h1></header>

<main>
  <div class="bar">
    <label>가로 <select id="w"></select></label>
    <label>세로 <select id="h"></select></label>
    <button class="btn gold" id="fresh">새 미로</button>
    <label><input type="checkbox" id="mark"> 보이는 칸</label>
    <label><input type="checkbox" id="rings"> 깊이 선</label>
  </div>

  <div class="wrap">
    <div class="col">
      <h2>미로</h2>
      <div class="board" id="board"></div>
      <p class="note">흰 칸을 탭하면 그 자리에 선다. 같은 칸을 다시 탭하면
        <b>서 → 북 → 동 → 남</b> 으로 90도씩 돈다.</p>
    </div>
    <div class="col">
      <h2>보이는 모습</h2>
      <div class="view" id="view"></div>
      <p class="note" id="what">아직 선 자리가 없다.</p>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* 서 · 북 · 동 · 남. 다시 탭할 때마다 이 차례로 넘어간다 */
  var DIRS = [
    {name: "서", dr: 0, dc: -1},
    {name: "북", dr: -1, dc: 0},
    {name: "동", dr: 0, dc: 1},
    {name: "남", dr: 1, dc: 0}
  ];
  /* 화면 기준 오른손 쪽. 서를 볼 때 오른쪽은 북이다 */
  function right(d) { return {dr: d.dc, dc: -d.dr}; }
  function left(d) { return {dr: -d.dc, dc: d.dr}; }

  var VW = 1.5;     /* 화면이 담는 폭 — 선 칸의 좌우 벽까지 보이게 넓힌다 */
  var DEEP = 12;    /* 판이 10칸을 안 넘으니 이만하면 늘 벽에 막힌다 */

  var board = document.getElementById("board");
  var view = document.getElementById("view");
  var what = document.getElementById("what");
  var selW = document.getElementById("w");
  var selH = document.getElementById("h");
  var mark = document.getElementById("mark");
  var rings = document.getElementById("rings");

  var W = 9, H = 9;
  var grid = [];          /* 1 이면 벽, 0 이면 길 */
  var at = null;          /* 선 자리 [행, 열] */
  var dir = 0;
  var seen = [];          /* 지금 보고 있는 칸들 */

  /* ── 미로 뽑기 ────────────────────────────────────────────────
     홀수 자리만 방으로 쓰고 그 사이 벽을 허문다. 이렇게 하면 길의 폭은
     반드시 한 칸이고, 흰 칸이 2×2 로 뭉치는 일도 생기지 않는다.
     테두리는 손대지 않으므로 사방이 막힌 채로 남는다 */
  function dig(w, h) {
    var g = [], r, c;
    for (r = 0; r < h; r++) {
      g.push([]);
      for (c = 0; c < w; c++) { g[r].push(1); }
    }
    g[1][1] = 0;
    var stack = [[1, 1]];
    var STEP = [[-2, 0], [2, 0], [0, -2], [0, 2]];
    while (stack.length) {
      var cur = stack[stack.length - 1];
      var open = [];
      STEP.forEach(function (s) {
        var nr = cur[0] + s[0], nc = cur[1] + s[1];
        if (nr > 0 && nc > 0 && nr < h - 1 && nc < w - 1 && g[nr][nc] === 1) {
          open.push([nr, nc, cur[0] + s[0] / 2, cur[1] + s[1] / 2]);
        }
      });
      if (!open.length) { stack.pop(); continue; }
      var p = open[Math.floor(Math.random() * open.length)];
      g[p[0]][p[1]] = 0;
      g[p[2]][p[3]] = 0;
      stack.push([p[0], p[1]]);
    }
    return g;
  }

  function wall(r, c) {
    return r < 0 || c < 0 || r >= H || c >= W || grid[r][c] === 1;
  }

  /* ── 판 그리기 ───────────────────────────────────────────────── */
  var ARROW = {
    "서": "2,5 7,1.5 7,8.5",
    "북": "5,2 1.5,7 8.5,7",
    "동": "8,5 3,1.5 3,8.5",
    "남": "5,8 1.5,3 8.5,3"
  };

  function drawBoard() {
    board.style.gridTemplateColumns = "repeat(" + W + ",1fr)";
    var html = "", r, c;
    for (r = 0; r < H; r++) {
      for (c = 0; c < W; c++) {
        var cls = "px" + (grid[r][c] === 0 ? " way" : "");
        var body = "";
        if (at && at[0] === r && at[1] === c) {
          body = '<svg viewBox="0 0 10 10"><polygon points="' +
                 ARROW[DIRS[dir].name] + '"/></svg>';
        }
        html += '<div class="' + cls + '" data-r="' + r + '" data-c="' + c +
                '">' + body + "</div>";
      }
    }
    board.innerHTML = html;
    if (mark.checked) {
      seen.forEach(function (s) {
        var px = board.children[s[0] * W + s[1]];
        if (px) { px.classList.add("seen"); }
      });
    }
  }

  /* ── 보이는 모습 ─────────────────────────────────────────────
     눈은 선 칸 한가운데에 있다. 칸 k 의 **뒷면**까지 거리는 k + 0.5 이고
     통로의 반폭이 0.5 이므로, 화면에 비친 그 자리의 반폭은
     0.5 / (k + 0.5) = 1 / (2k + 1) 이다.

     그러니 칸 k 의 옆벽은 |X| 가 far(k-1) 에서 far(k) 로 좁아지는
     사다리꼴이고, 그 네 귀퉁이는 모두 |Y| = |X| 위에 앉는다. 선 칸(k=0)의
     옆벽은 화면 끝에서 시작한다.

     옆이 뚫려 있으면 그 자리로 **꺾인 통로의 건너편 벽**이 보인다. 그 벽은
     far(k) 거리에 서 있으므로 |Y| ≤ far(k) 인 띠만 검고, 위아래로 남는
     몫은 그 통로의 천장과 바닥이라 희다 */
  function far(k) { return 1 / (2 * k + 1); }

  function slab(sign, a, b, blocked) {
    if (blocked) {
      return '<polygon points="' +
        (sign * a) + "," + a + " " + (sign * b) + "," + b + " " +
        (sign * b) + "," + (-b) + " " + (sign * a) + "," + (-a) + '"/>';
    }
    var x = sign < 0 ? -a : b;
    return '<rect class="wall" x="' + x + '" y="' + (-b) +
           '" width="' + (a - b) + '" height="' + (2 * b) + '"/>';
  }

  function drawView() {
    seen = [];
    if (!at) {
      view.innerHTML = "";
      what.textContent = "아직 선 자리가 없다.";
      return;
    }
    var d = DIRS[dir], lf = left(d), rt = right(d);
    var r = at[0], c = at[1], k, out = "";
    for (k = 0; k < DEEP; k++) {
      var a = k === 0 ? VW : far(k - 1);
      var b = far(k);
      seen.push([r, c]);
      out += slab(-1, a, b, wall(r + lf.dr, c + lf.dc));
      out += slab(1, a, b, wall(r + rt.dr, c + rt.dc));
      if (rings.checked) {
        out += '<rect class="ring" x="' + (-b) + '" y="' + (-b) +
               '" width="' + (2 * b) + '" height="' + (2 * b) + '"/>';
      }
      var nr = r + d.dr, nc = c + d.dc;
      if (wall(nr, nc)) {
        /* 앞이 막혔다 — 그 벽이 소실점 자리를 덮는다 */
        out += '<rect class="wall" x="' + (-b) + '" y="' + (-b) +
               '" width="' + (2 * b) + '" height="' + (2 * b) + '"/>';
        break;
      }
      r = nr; c = nc;
    }
    view.innerHTML =
      '<svg viewBox="' + (-VW) + " " + (-VW) + " " + (2 * VW) + " " +
      (2 * VW) + '" preserveAspectRatio="xMidYMid meet">' + out + "</svg>";
    what.textContent = "(" + at[0] + ", " + at[1] + ") 에 서서 " +
      d.name + "쪽 — " + seen.length + "칸이 보인다.";
  }

  function draw() { drawView(); drawBoard(); }

  /* ── 손이 닿는 데 ────────────────────────────────────────────── */
  board.addEventListener("click", function (e) {
    var px = e.target.closest(".px");
    if (!px || !px.classList.contains("way")) { return; }
    var r = +px.dataset.r, c = +px.dataset.c;
    if (at && at[0] === r && at[1] === c) {
      dir = (dir + 1) % 4;              /* 같은 칸을 다시 탭하면 90도 돈다 */
    } else {
      at = [r, c];
      dir = 0;                          /* 새로 서면 서쪽부터 */
    }
    draw();
  });

  function fresh() {
    W = +selW.value; H = +selH.value;
    grid = dig(W, H);
    at = null; dir = 0;
    draw();
  }

  document.getElementById("fresh").addEventListener("click", fresh);
  selW.addEventListener("change", fresh);
  selH.addEventListener("change", fresh);
  mark.addEventListener("change", draw);
  rings.addEventListener("change", draw);

  /* 가로·세로는 각각 최대 10 이다 (10 × 10 = 100) */
  [selW, selH].forEach(function (sel) {
    var html = "";
    for (var n = 3; n <= 10; n++) {
      html += '<option value="' + n + '"' + (n === 9 ? " selected" : "") +
              ">" + n + "</option>";
    }
    sel.innerHTML = html;
  });

  fresh();
})();
</script>
</body>
</html>
